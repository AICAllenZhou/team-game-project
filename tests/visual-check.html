<!doctype html><meta charset="utf-8"><title>Dustyard visual check</title><style>body{margin:0;background:#24201b;color:#fff;font:18px sans-serif}canvas{display:block}nav{position:fixed;top:16px;left:16px}button{font:inherit;margin:4px;padding:8px}</style><nav><button id="arena">Arena</button><button id="bow">Bow</button><button id="spawn">Spawn view</button><button id="draw">Draw bow</button><button id="fire">Fire bow</button><button id="nock">Nock preview</button></nav><script type="module">
import * as T from '/vendor/three.module.js';import {createVoxelWalls} from '/voxel-walls.mjs';import {createVoxelWallView} from '/voxel-wall-view.js';import {duelSpawn} from '/arena.mjs';import {createCanCharacter} from '/can-characters.js';import {createBow,animateBow,releaseBow} from '/bow-view.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setClearColor(0x958a77);document.body.append(r.domElement);const s=new T.Scene();s.add(new T.HemisphereLight(0xffffff,0x746144,3));const sun=new T.DirectionalLight(0xffe1ab,2);sun.position.set(-10,25,8);s.add(sun);const a=new T.Group();s.add(a);createVoxelWallView(a,createVoxelWalls('duel'));const cans=[];for(const index of [0,1]){const p=duelSpawn(index),can=createCanCharacter(index);can.position.set(p.x,p.y,p.z);can.rotation.y=p.yaw;a.add(can);cans.push(can);}const b=createBow(s);b.visible=false;const c=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,300);
function arena(){c.fov=40;c.updateProjectionMatrix();cans.forEach(can=>can.visible=true);a.visible=true;b.visible=false;c.position.set(0,129,54);c.lookAt(0,0,0);r.render(s,c);}function bow(){a.visible=false;b.visible=true;c.fov=40;c.updateProjectionMatrix();c.position.set(1.4,.3,1.7);c.lookAt(0,0,0);r.render(s,c);}document.querySelector('#spawn').onclick=()=>{a.visible=true;b.visible=false;c.fov=100;c.updateProjectionMatrix();cans[0].visible=false;const p=duelSpawn(0);c.position.set(p.x,p.y+1.5,p.z);c.lookAt(0,p.y+1.5,0);r.render(s,c);};document.querySelector('#arena').onclick=arena;let charge=0,reload=-1,preview=false,last=performance.now();
 document.querySelector('#bow').onclick=bow;
 document.querySelector('#draw').onclick=()=>{bow();charge=1;reload=-1;preview=false;for(let i=0;i<60;i++)animateBow(b,1,true);r.render(s,c);};
 document.querySelector('#fire').onclick=()=>{bow();releaseBow(b);charge=0;reload=0;preview=false;animateBow(b,0,false,{dt:1/60,reload});r.render(s,c);};
 document.querySelector('#nock').onclick=()=>{bow();charge=0;reload=.45;preview=true;for(let i=0;i<60;i++)animateBow(b,0,false,{dt:1/60,reload});r.render(s,c);};
 function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(b.visible){if(!preview&&reload>=0){reload+=dt/.65;if(reload>=1)reload=-1;}animateBow(b,charge,reload<0,{dt,reload});r.render(s,c);}requestAnimationFrame(frame);}requestAnimationFrame(frame);arena();
</script>
