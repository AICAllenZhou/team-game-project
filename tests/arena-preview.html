<!doctype html><meta charset="utf-8"><title>Rampyard arena preview</title>
<style>body{margin:0;background:#8f9dab;color:#fff;font:15px system-ui}canvas{display:block}nav{position:fixed;top:14px;left:16px}button{border:1px solid #90877b;border-radius:4px;background:#34312c;color:#fff;padding:9px 13px;margin:3px;font:inherit}output{display:block;margin:9px;text-shadow:0 1px 3px #000}</style>
<nav><button id="overview">Overview</button><button id="spawn-a">Spawn A</button><button id="spawn-b">Spawn B</button><button id="ramp">Central ramp</button><button id="damage">Break cover</button><button id="reset">Reset</button><output id="status">31.2 × 21.6 · 0.15-unit blocks · cutaway overview</output></nav>
<script type="module">
import * as T from '/vendor/three.module.js';import {DUEL_SOLIDS,duelSpawn} from '/arena.mjs';import {createVoxelWalls} from '/voxel-walls.mjs';import {createVoxelWallView} from '/voxel-wall-view.js';import {createCanCharacter} from '/can-characters.js';
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.setClearColor(0x9baabb);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);
const s=new T.Scene();s.add(new T.HemisphereLight(0xe6eeff,0x736855,2));const sun=new T.DirectionalLight(0xffefd0,2.2);sun.position.set(-12,24,15);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:80});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;s.add(sun);
const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,150),world=createVoxelWalls('duel'),view=createVoxelWallView(s,world),bounds=[];
for(const b of DUEL_SOLIDS){const m=new T.Mesh(new T.BoxGeometry(b.w,b.h,b.d),new T.MeshStandardMaterial({color:b.color,roughness:1}));m.position.set(b.x,b.y,b.z);m.castShadow=true;m.receiveShadow=true;s.add(m);bounds.push(m);}
const cans=[0,1].map(i=>{const p=duelSpawn(i),can=createCanCharacter(i);can.position.set(p.x,p.y,p.z);can.rotation.y=p.yaw;s.add(can);return can;});const status=document.querySelector('#status');
function overview(){bounds.forEach((m,i)=>m.visible=i!==1&&i!==4);cans.forEach(m=>m.visible=true);c.fov=45;c.position.set(-29,29,29);c.lookAt(0,.6,0);c.updateProjectionMatrix();status.textContent='31.2 × 21.6 · 0.15-unit blocks · cutaway overview';}
function spawn(i){bounds.forEach(m=>m.visible=true);cans.forEach((m,k)=>m.visible=i!==k);const p=duelSpawn(i);c.position.set(p.x,p.y+1.5,p.z);c.fov=90;c.lookAt(0,1.5,0);c.updateProjectionMatrix();status.textContent='Opposite-end spawn · fully protected by breakable cover';}
document.querySelector('#overview').onclick=overview;document.querySelector('#spawn-a').onclick=()=>spawn(0);document.querySelector('#spawn-b').onclick=()=>spawn(1);
document.querySelector('#ramp').onclick=()=>{bounds.forEach(m=>m.visible=true);cans.forEach(m=>m.visible=true);c.position.set(-7.2,1.5,0);c.fov=85;c.lookAt(0,2.7,0);c.updateProjectionMatrix();status.textContent='Walkable double ramp · ramp and side lips are destructible';};
document.querySelector('#damage').onclick=()=>{for(let i=0;i<12;i++){const hit=world.trace({x:-13.5,y:1.5,z:0},{x:1,y:0,z:0});if(hit){const cells=world.damage(hit,3);view.burst(hit.wallId,cells);}}status.textContent='Cover damaged · permanent floor and orange boundaries remain solid';};
document.querySelector('#reset').onclick=()=>{world.reset();status.textContent='Arena restored';};let last=performance.now();function frame(now){view.update(Math.min(.05,(now-last)/1000));last=now;r.render(s,c);requestAnimationFrame(frame);}overview();requestAnimationFrame(frame);
</script>
